# Ключевые основы слов для `python -m norms.pick` (владелец A13). Сравнение — по нормализованному
# тексту пункта (регистр и типографика игнорируются). Это поиск КАНДИДАТОВ для человека, не вывод.
# score = 2 × (число разных основ из any) + (основы из boost) + (модальные слова), если any ≥ 1.
version: 1
modal: ["запрещается", "не допускается", "не разрешается", "обязан", "должен", "должны", "осуществляется", "обеспечивает"]
types:
  V01:
    any: ["посторонн", "лиц, не являющ", "не работающ", "доступ в кассов", "вход в кассов", "допуска"]
    boost: ["кассовый узел", "кассового узла", "кассов"]
  V02:
    any: ["рабочее место", "рабочего места", "без присмотра", "оставля", "отсутстви", "покида", "до окончания обслуживания", "до завершения"]
    boost: ["кассовый работник", "кассового работника", "наличн"]
  V03:
    any: ["сейф", "кладов", "хранилищ"]
    boost: ["закрыва", "опечатыва", "ключ", "код", "в течение рабочего дня"]
  V04:
    any: ["двер", "служебным входом", "вход"]
    boost: ["кассовый узел", "кассового узла", "закрыва"]
  V05:
    any: ["мобильн", "телефон", "средств связи", "сотов"]
    boost: ["кассов"]
  V06:
    any: ["пищ", "напит", "еды", "питани"]
    boost: ["кассов"]
  V07:
    any: ["сумк", "инкассатор", "пломб", "мешк"]
    boost: ["прием", "передач", "целостност", "сейф"]
  V08:
    any: ["пересч", "в присутствии клиента"]
    boost: ["кассовым работником", "наличные деньги"]
  V09:
    any: ["личных вещей", "личные вещи", "одежд"]
    boost: ["вне кассового узла", "работников банка"]
  V99:
    any: ["видеонаблюд", "видеокамер", "видеозапис"]
    boost: ["кассов"]
