  V08:
    name: "Пересчёт наличных не в присутствии клиента"
    legal_status: candidate
    legal_note: >-
      Пункт 20 Правил НБРК № 231: приём и пересчёт наличных кассовым работником в присутствии клиента;
      аналогичное требование при выдаче (подп. 4, номер пункта не установлен). Применимо только к
      операциям приёма или выдачи наличных клиенту. Ключевое наблюдаемое условие — отсутствие клиента
      у окна в момент пересчёта (роль «посетитель» по клиентской зоне и поведению, не по внешности;
      n_persons — только грубый прокси). Руки, скрытые от камеры, и «вне обзора камеры» сами по себе
      нормой не подтверждены.
    observable:
      - "кассир пересчитывает наличные, когда клиента у окна кассы нет"
      - "кассир уносит наличные клиента из зоны окна и пересчитывает их вне видимости клиента"
    not_observable:
