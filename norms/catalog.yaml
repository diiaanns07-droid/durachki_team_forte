types:
  V01:
    name: "Посторонний на стороне кассира / в кассовой зоне"
    legal_status: disabled
    legal_note: >-
      Пункт, прямо запрещающий нахождение лица на стороне кассира и применимый к кадру, в доступных
      фрагментах не найден. Изоляция кассового узла (НБРК № 14, Г1) — требование к устройству
      помещения, а не к поведению; допуск человека по видео не устанавливается.
    observable:
      - "человек, который по поведению и зоне не является кассиром, находится на стороне кассира: за кассовым столом, у сейфа, у ценностей"
      - "во время обслуживания клиента в кассовой зоне появляется второй посторонний"
      - "человек входит в кассовую зону, когда наличные открыты или сейф открыт"
    not_observable:
      - "наличие допуска у лица"
      - "личность и должность человека"
      - "является ли помещение кассовым узлом"
    exclusions:
      - "клиент, сидящий напротив кассира с клиентской стороны, — норма"
      - "контролирующий работник, заведующий кассой, инкассатор при процедуре или охрана — допустимые ситуации, по видео не отличимые от постороннего"
      - "кассир, вошедший через дверь в первые секунды, — кассир (роль по поведению, не по порядку появления)"
    description_template: "{t}: наблюдение — {facts}. Норма не подтверждена; допуск и личность по видео не устанавливаются."
    severity: high
    rules: []
    research_candidates:
      - "НБРК № 14 (V2000020075): пункты о порядке доступа в кассовый узел — искать в полном тексте"
      - "НБРК № 231 (V1900019680): пункты о кассовом узле и лицах, допускаемых к кассовым операциям"
    examples:
      - kind: positive
        facts: ["со стороны кассира у сейфа стоит второй человек, который не работает с кассой", "наличные открыты на столе"]
        signals: {outsider_in_cashier_area: 1.0, n_persons: 2, cash_visible: 1.0}
        expected: candidate
      - kind: negative
        facts: ["клиент сидит напротив кассира с клиентской стороны", "кассир обслуживает клиента"]
        signals: {outsider_in_cashier_area: 0.0, n_persons: 2, cashier_in_workplace: 1.0}
        expected: no_violation
      - kind: unknown
        facts: ["второй человек частично вне кадра, сторона стола не определяется"]
        signals: {outsider_in_cashier_area: null, n_persons: 2}
        expected: unknown

  V02:
    name: "Кассир покинул рабочее место, оставив ценности без присмотра"
    legal_status: candidate
    legal_note: >-
      П. 22 Правил НБРК № 231: кассовому работнику не допускается покидать рабочее место до окончания
      обслуживания клиента — применимо только к уходу ВО ВРЕМЯ обслуживания клиента. Для случая «после
      ухода на столе остались наличные» относится фраза о рабочем месте (номер пункта не установлен):
      на рабочем месте находятся наличные деньги клиента, ранее принятые хранятся в специальных
      устройствах. Требования держать сейф закрытым в найденных фрагментах нет: открытый сейф после
      ухода — наблюдение без пункта (см. V03).
    observable:
      - "кассир покидает рабочее место, пока клиент у окна (обслуживание не завершено)"
      - "после ухода кассира из рабочей зоны на столе остаются наличные или инкассаторская сумка (оценивается в окне после ухода)"
      - "после ухода кассира сейф остаётся открытым"
    not_observable:
      - "закончено ли обслуживание клиента и проведена ли операция"
      - "принадлежат ли наличные на столе текущему клиенту или приняты ранее"
      - "передал ли кассир ценности или обслуживание другому работнику вне кадра"
      - "заперты ли ящики стола, не видимые камере"
    exclusions:
      - "уход при убранных ценностях и закрытом сейфе без клиента у окна — норма"
      - "кассир отошёл в пределах рабочего места (виден у стола или сейфа) — не уход"
      - "кассир рядом с наличными, но вне кадра из-за ракурса"
      - "после ухода выключен свет: состояние стола неизвестно, а не «пусто»"
    description_template: "{t}: признаки возможного нарушения — {facts}. Требует проверки: п. 22 Правил НБРК № 231 применим, если кассир ушёл до окончания обслуживания клиента."
    severity: high
    rules:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня (постановление Правления НБРК от 29.11.2019 № 231)"
        clause: "п. 22"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        quote: "Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента."
        verified: false
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня (постановление Правления НБРК от 29.11.2019 № 231)"
        clause: null
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        quote: "На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах"
        verified: false
    rule_checks:
      - quote_level: snippet
        quote_source: "zakon.uchet.kz/rus/docs/V1900019680 (сниппет с номером «22.», Q6) и bizup.kz/en/documents/v1900019680 (Q7) — поисковая выдача 2026-10-17; см. evidence/search_log.md"
        quote_checked_by_human: false
        applicability_checked_by_human: false
        currency: "акт действует по справочным системам (последние изменения — аннотация от 10.11.2025); редакция п. 22 на adilet не сверена"
        applicability: "уход кассового работника с рабочего места во время обслуживания клиента (клиент у окна, операция не завершена)"
        conditions_visible:
          - "кассир покидает зону рабочего места"
          - "у окна остаётся клиент (роль по зоне и поведению, не по внешности)"
        conditions_not_visible:
          - "завершена ли операция и оформлены ли документы"
          - "передано ли обслуживание другому работнику"
      - quote_level: snippet
        quote_source: "zakon.uchet.kz/rus/docs/V1900019680 и bizup.kz — сниппеты поисковой выдачи 2026-10-17 (Q6, Q8, Q9); номер пункта в ответах расходится"
        quote_checked_by_human: false
        applicability_checked_by_human: false
        currency: "номер пункта и редакция не сверены; продолжение предложения (перечень устройств) не получено"
        applicability: "после ухода кассира на столе остаются наличные, которые не относятся к обслуживаемому клиенту (ранее принятые должны быть в специальных устройствах)"
        conditions_visible:
          - "на столе видны наличные после ухода кассира"
          - "у окна нет клиента"
        conditions_not_visible:
          - "принадлежат ли наличные текущему клиенту"
          - "что входит в «специальные устройства» и закрыты ли они"
    research_candidates:
      - "НБРК № 231, Ф13: номер пункта и перечень «специальных устройств» (требуется ли их запирать)"
      - "НБРК № 231, п. 22: относится ли только к обслуживанию клиента или и к внутренним операциям"
    examples:
      - kind: positive
        facts: ["у окна клиент", "кассир вышла из рабочей зоны до окончания обслуживания", "на столе остались наличные"]
        signals: {cashier_in_workplace: 0.0, cash_visible: 1.0, workplace_unattended_with_cash: 1.0, n_persons: 1}
        expected: candidate
      - kind: positive
        facts: ["клиента у окна нет", "кассир вышла из рабочей зоны", "на столе остались наличные"]
        signals: {cashier_in_workplace: 0.0, cash_visible: 1.0, workplace_unattended_with_cash: 1.0, n_persons: 0}
        expected: candidate
      - kind: negative
        facts: ["клиента нет", "кассир убрала наличные в сейф, закрыла его и вышла"]
        signals: {cashier_in_workplace: 0.0, cash_visible: 0.0, safe_open: 0.0, workplace_unattended_with_cash: 0.0, n_persons: 0}
        expected: no_violation
      - kind: unknown
        facts: ["после ухода кассира свет выключен, стол не виден"]
        signals: {cashier_in_workplace: 0.0, cash_visible: null, safe_open: null}
        expected: unknown

  V03:
    name: "Сейф открыт без присмотра или за спиной работающего кассира"
    legal_status: disabled
    legal_note: >-
      Норма о порядке закрытия сейфа и хранения ценностей в течение рабочего дня в действующей
      редакции не получена (найденная формулировка — из утративших силу правил 2001 г.).
    observable:
      - "дверца сейфа открыта, рядом нет кассира"
      - "кассир работает за столом спиной к открытому сейфу (кандидат)"
    not_observable:
      - "кто отвечает за сейф, у кого ключи и коды"
      - "что находится в сейфе"
    exclusions:
      - "сейф открыт, пока кассир кладёт в него или берёт из него ценности, — норма"
      - "сейф открыт на время процедуры инкассации (сумка из рук в руки и сразу в сейф)"
    description_template: "{t}: наблюдение — {facts}. Норма не подтверждена."
    severity: high
    rules: []
    research_candidates:
      - "НБРК № 231: порядок хранения ценностей, ключей и кодов от сейфа в течение рабочего дня"
      - "НБРК № 231, Ф13: перечень «специальных устройств» для ранее принятых наличных — есть ли требование их запирать"
    examples:
      - kind: positive
        facts: ["сейф открыт", "кассир сидит за столом спиной к сейфу и работает с документами"]
        signals: {safe_open: 1.0, cashier_in_workplace: 1.0, cashier_facing_away: 1.0}
        expected: candidate
      - kind: negative
        facts: ["кассир открыла сейф, положила наличные и сразу закрыла"]
        signals: {safe_open: 0.0, cashier_in_workplace: 1.0}
        expected: no_violation
      - kind: unknown
        facts: ["сейф перекрыт фигурой человека, состояние дверцы не видно"]
        signals: {safe_open: null}
        expected: unknown

  V04:
    name: "Вход в кассовое помещение при открытых ценностях"
    legal_status: disabled
    legal_note: >-
      Найден только конструктивный пункт (НБРК № 14, Г1: кассовый узел изолируется одним закрывающимся
      служебным входом). Требования держать дверь закрытой во время операций в выдаче нет; открытая
      дверь сама по себе — не нарушение.
    observable:
      - "через дверь в кассовую зону входит человек, когда наличные открыты на столе или открыт сейф"
    not_observable:
      - "является ли помещение кассовым узлом"
      - "допуск входящего человека"
    exclusions:
      - "открытая дверь без входа постороннего"
      - "вход кассира (роль по поведению и зоне)"
      - "вход при убранных ценностях и закрытом сейфе"
    description_template: "{t}: наблюдение — {facts}. Норма не подтверждена."
    severity: medium
    rules: []
    research_candidates:
      - "НБРК № 14: пункты о режиме дверей кассового узла и касс (если есть)"
    examples:
      - kind: positive
        facts: ["в кассовую зону входит человек, не работающий с кассой", "на столе открыты наличные"]
        signals: {door_open: 1.0, outsider_in_cashier_area: 1.0, cash_visible: 1.0}
        expected: candidate
      - kind: negative
        facts: ["дверь открыта, никто не входит, ценности убраны"]
        signals: {door_open: 1.0, outsider_in_cashier_area: 0.0, cash_visible: 0.0}
        expected: no_violation
      - kind: unknown
        facts: ["дверь вне кадра, вход не виден"]
        signals: {door_open: null}
        expected: unknown

  V05:
    name: "Мобильный телефон в руке кассира при работе с ценностями"
    legal_status: disabled
    legal_note: >-
      Нормы НПА РК, запрещающей мобильный телефон на рабочем месте кассира, в выдаче не найдено;
      такие ограничения, если есть, устанавливаются внутренними документами банка.
    observable:
