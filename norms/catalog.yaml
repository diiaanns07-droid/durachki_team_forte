# Kassa Sentinel — каталог типов нарушений и норм РК (владелец A13).
# Схема совместима с преамбулой: types.<ID>.{name, observable, not_observable, description_template,
# severity, rules[]}; rules[] — ровно поля contracts.RuleRef (document, clause, url, quote, verified).
# Доп. поля (игнорируются старыми потребителями): legal_status, legal_note, exclusions, rule_checks,
# examples, research_candidates; разделы documents, exclusions, levels.
#
# ПРИНЦИП: сначала действующая норма → условия её применимости → наблюдаемое действие.
# Тип без подтверждённой нормы — legal_status: disabled: детекция может показываться человеку
# как наблюдение, но ссылка на норму к ней НЕ прикрепляется (rules: []).
# Статусы раздельно (rule_checks): где сохранена цитата (quote_level), сверил ли человек цитату
# с официальным текстом (quote_checked_by_human), проверил ли человек применимость
# (applicability_checked_by_human). `python -m norms.validate` проверяет схему и ДОСЛОВНОЕ
# вхождение цитат — это проверка цитаты, не юридическая гарантия.
version: 1
updated: "2026-10-17"
disclaimer: >-
  Результат — подсказка для проверяющего, не юридическое заключение. Ссылки на нормы получены
  из поисковой выдачи (adilet.zan.kz из среды разработки был недоступен) и требуют сверки
  с действующей редакцией на adilet.zan.kz.

levels:
  legal_status:
    confirmed: >-
      Норма действует (статус и редакция сверены на adilet), цитата сверена человеком с полным
      текстом, применимость к поведению проверена человеком. Пока таких типов нет.
    candidate: >-
      В действующем (по справочным системам) акте найден пронумерованный пункт, прямо
      относящийся к наблюдаемому действию; цитата — из поисковой выдачи; применимость ограничена
      условиями из rule_checks. Показывать с пометкой «требует сверки», не как вывод.
    disabled: >-
      Действующая норма, прямо требующая или запрещающая наблюдаемое действие, не подтверждена,
      или условия её применимости по видео не видны. Ссылка на норму не прикрепляется.
  quote_level:
    fulltext: "цитата найдена в полном тексте страницы adilet (python -m norms.fetch / norms_fetched)"
    snippet: "цитата получена из поисковой выдачи как фрагмент страницы; дословность не сверена"
    none: "цитаты нет (clause: null) — только указание на документ"
  example_expected:
    candidate: "синтетический случай, в котором детектор должен выдать кандидата нарушения"
    no_violation: "синтетический случай нормы — кандидата быть не должно"
    unknown: "состояние не наблюдаемо (null в signals) — ни «нарушение», ни «нет нарушения»"

# Общие исключения: что само по себе НЕ является нарушением и чего нельзя утверждать по видео.
exclusions:
  - "Мобильный телефон в кадре или на столе сам по себе не является нарушением; стационарный телефон — рабочее средство."
  - "Рука у лица без телефона, стакана или еды — не сигнал."
  - "Еда или напиток (чашка, бутылка) на рабочем месте без приёма пищи при открытых ценностях не являются нарушением."
  - "Открытая дверь или перегородка сама по себе не является нарушением."
  - "Второй человек в кадре сам по себе не является нарушением; клиент напротив кассира с клиентской стороны — норма."
  - "Уход кассира с рабочего места — норма, если ценности убраны и сейф закрыт."
  - "Выход человека из кадра не равен уходу с рабочего места: камера покрывает не всё помещение."
  - "Не увидели объект или человека — это «неизвестно», а не «нет» (например, при выключенном свете)."
  - "Перекрытие рук корпусом, монитором или счётчиком из-за ракурса камеры не равно сокрытию."
  - "Роль человека определяется по поведению и зоне (кто работает со стороны кассы), а не по порядку появления, одежде или внешности."
  - "По видео нельзя установить: допуск лица, его личность и должность, сумму, корректность операции и документов, подлинность банкнот, умысел."

