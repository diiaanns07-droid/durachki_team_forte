# Kassa Sentinel — пороги вердикта ml/fusion (владелец A12).
# Нарушение попадает в ответ и даёт verdict=violation, если его уверенность ≥ τ[type_id].
# Стартовые значения — эвристика (смещены в сторону полноты: пропуск нарушения недопустим).
# Перенастройка на размеченных данных:
#   python -m ml.fusion.tune --preds preds_raw/ --labels data/labels.csv --out ml/fusion/thresholds.yaml
version: 1
tuned: false
default: 0.45
per_type:
  V01: 0.45   # посторонний в кассовом помещении
  V02: 0.45   # кассир покинул рабочее место, ценности без присмотра
  V03: 0.45   # сейф открыт без присмотра / при посторонних
  V04: 0.50   # дверь кассового помещения открыта
  V05: 0.50   # мобильный телефон при работе с ценностями
  V06: 0.50   # еда/напитки на рабочем месте с наличными
  V07: 0.45   # нарушение порядка приёма-передачи инкассаторской сумки
  V08: 0.50   # пересчёт/передача наличных вне обзора камеры
  V99: 0.60   # иное подозрительное действие (catch-all)
